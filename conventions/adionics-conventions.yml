  current: wp/v2
  detail: >-
    Namespaces are versioned in the path (wp/v2, pll/v1, oembed/1.0, wp-abilities/v1, mcp). The
    version is WordPress core's, not Adionics'. 23 namespaces were listed at capture.
  see: lifecycle/adionics-lifecycle.yml
error_envelope:
