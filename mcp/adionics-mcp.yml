detail: >-
  The endpoint is genuinely served — the `mcp` namespace and both of its routes appear in the public
  REST index, and the route accepts POST/GET/DELETE — but every JSON-RPC method, including
  initialize, is refused to an anonymous client with HTTP 401 rest_forbidden. The tool set is
  therefore auth-gated and could not be enumerated. Authentication is WordPress Application
  Passwords (HTTP Basic), issued only from wp-admin to an existing Adionics WordPress user; there is
  no self-service path to a credential. The backing capability set would be the WordPress Abilities
  API at /wp-json/wp-abilities/v1/abilities, which is gated by the same check. Nothing is asserted
  here about which tools exist — none were observed, and none are invented.
