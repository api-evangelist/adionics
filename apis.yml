aid: adionics
name: Adionics
description: >-
  Adionics is a French cleantech company founded in 2012 in Paris by Guillaume de Souza, out of
  research into liquid-liquid salt extraction started in 2007. It develops and licenses a patented
  Direct Lithium Extraction (DLE) process built on Flionex, a proprietary, thermally regenerated
  and highly selective liquid salt absorbent that captures lithium salts from brine at ambient
  temperature and releases them at higher temperature in a closed loop, with no traditional
  reagents and more than 90% less water than evaporation ponds. The company sells a staged
  engagement to mining operators — a proprietary modeling study, a lab-scale bench test, an on-site
  pilot plant, and basic engineering plus commissioning support for a commercial plant — targeting
  lithium-rich salars, geothermal brines, oil-and-gas produced water, industrial effluents and
  battery recycling streams. It has run 1,500 hours of continuous lithium extraction in the Salar
  de Atacama, opened a pilot test centre in Salta Province, Argentina, and raised roughly $40M
  across four rounds. Adionics is a process-technology and engineering company, not a software
  vendor, and publishes no developer portal, no product API, no SDKs and no OpenAPI. The only
  machine-readable interface it exposes is the WordPress REST content API behind www.adionics.com,
  which is anonymously readable, read-only for the public, and captured here for discovery.
