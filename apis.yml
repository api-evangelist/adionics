- aid: adionics:adionics-mcp-server
  name: Adionics MCP Server
  description: >-
    A live Model Context Protocol endpoint registered on the adionics.com WordPress install by the
    WordPress MCP Adapter, at https://www.adionics.com/wp-json/mcp/mcp-adapter-default-server. The route
    is served (the mcp namespace and both routes are listed in the public REST index) but every JSON-RPC
    call is authentication-gated: initialize and tools/list both return HTTP 401 rest_forbidden to an
    anonymous client, so the live tool schemas could not be enumerated. This is CMS-plugin infrastructure
    rather than a purpose-built Adionics product MCP server.
  humanURL: https://www.adionics.com/wp-json/mcp
